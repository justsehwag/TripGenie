# Amplify build spec for the TripGenie Next.js SSR app.
#
# Environment variables (COGNITO_*, BEDROCK_*) are managed on the Amplify app
# AND branch via the Amplify API. IMPORTANT: do NOT edit them in the Amplify
# console env-var editor - its save replaces the whole set and can wipe them.
#
# The preBuild step writes whichever of these are present in the build
# environment into .env.production, and next.config.ts additionally inlines
# them into the SSR bundle so server routes read them at runtime. Bedrock access
# itself resolves via the Amplify compute role (TripGenieAmplifyComputeRole).
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        - |
          rm -f .env.production
          for VAR in COGNITO_USER_POOL_ID COGNITO_CLIENT_ID COGNITO_REGION BEDROCK_MODEL_ID BEDROCK_REGION AWS_REGION; do
            VALUE="$(printenv "$VAR" || true)"
            if [ -n "$VALUE" ]; then
              echo "$VAR=$VALUE" >> .env.production
            fi
          done
          echo "Wrote .env.production with $(wc -l < .env.production 2>/dev/null || echo 0) lines"
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*