version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        - |
          echo "=== TRIPGENIE ENV DIAGNOSTIC START ==="
          echo "COGNITO_USER_POOL_ID present: ${COGNITO_USER_POOL_ID:+YES}${COGNITO_USER_POOL_ID:-NO}"
          echo "COGNITO_CLIENT_ID present: ${COGNITO_CLIENT_ID:+YES}${COGNITO_CLIENT_ID:-NO}"
          echo "BEDROCK_MODEL_ID present: ${BEDROCK_MODEL_ID:+YES}${BEDROCK_MODEL_ID:-NO}"
          echo "All env keys matching COGNITO/BEDROCK:"
          env | grep -E "COGNITO|BEDROCK" | sed "s/=.*/=<redacted>/" || echo "  (none found in env)"
          echo "=== TRIPGENIE ENV DIAGNOSTIC END ==="
        - |
          rm -f .env.production
          for VAR in COGNITO_USER_POOL_ID COGNITO_CLIENT_ID COGNITO_REGION BEDROCK_MODEL_ID BEDROCK_REGION AWS_REGION; do
            VALUE="$(printenv "$VAR" || true)"
            if [ -n "$VALUE" ]; then
              echo "$VAR=$VALUE" >> .env.production
            fi
          done
          echo "Wrote .env.production with $(wc -l < .env.production 2>/dev/null || echo 0) lines"
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*